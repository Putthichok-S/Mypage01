<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Me - Natapat</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="container">
    <h2>แบบฟอร์มการติดต่อ (Contact Form)</h2>
    <p>หากต้องการสอบถามข้อมูลหรือติดต่องาน สามารถกรอกแบบฟอร์มด้านล่างนี้ได้เลยครับ</p>

    <form class="contact-form" action="#" method="post">
      <div class="form-group">
        <label for="name">ชื่อ - นามสกุล:</label>
        <input type="text" id="name" name="name" placeholder="กรอกชื่อของคุณ" required>
      </div>

      <div class="form-group">
        <label for="email">อีเมลติดต่อ:</label>
        <input type="email" id="email" name="email" placeholder="example@email.com" required>
      </div>

      <div class="form-group">
        <label for="subject">หัวข้อ:</label>
        <input type="text" id="subject" name="subject" placeholder="เรื่องที่ต้องการติดต่อ" required>
      </div>

      <div class="form-group">
        <label for="message">ข้อความ:</label>
        <textarea id="message" name="message" rows="5" placeholder="พิมพ์ข้อความที่นี่..." required></textarea>
      </div>

      <div class="form-group">
        <button type="submit">ส่งข้อความ</button>
      </div>
    </form>

    <div style="margin-top: 20px;">
      <a href="index.html" class="btn-contact">← กลับไปยังหน้าหลัก</a>
    </div>

    <footer>
      <p>
        <a href="https://github.com" target="_blank">My GitHub</a> | 
        <a href="index.html">Home</a>
      </p>
    </footer>
  </div>

</body>
</html>
